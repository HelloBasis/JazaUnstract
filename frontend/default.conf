server {
    listen 80;
    server_name unstract.jaza.ai;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing - redirect all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve static files
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
    }
}
